; NextNeo Vista — código COMPARTILHADO entre as placas (esp32-s3/, esp32-p4/).
; Cada placa usa esta pasta como biblioteca: lib_deps = symlink://../shared
;
; Este arquivo existe só para os testes de lógica no computador (sem placa, segundos):
;   ./tools/firmware.sh shared pio test -e native
; Só os arquivos C++ puros (sem Arduino/LVGL) entram aqui.
[platformio]
default_envs = native

[env:native]
platform = native
build_flags = -std=gnu++17 -I src
lib_deps = bblanchon/ArduinoJson@^7.2.0
lib_compat_mode = off
build_src_filter =
    -<*>
    +<core/text_utils.cpp>
    +<core/i18n.cpp>
    +<modules/weather/weather_codes.cpp>
    +<modules/finance/finance_symbols.cpp>
    +<modules/servers/servers_link.cpp>
    +<modules/servers/servers_retry.cpp>
    +<modules/flight_radar/flight_filter.cpp>
    +<modules/flight_radar/flight_projection.cpp>
    +<modules/flight_radar/flight_parser.cpp>
    +<modules/sky/sky_orbit.cpp>
    +<modules/garden/garden_model.cpp>
    +<modules/calendar/holidays_model.cpp>
test_framework = unity
test_build_src = yes
test_filter = test_native_*
