; NextNeo Vista — placa ESP32-S3 com tela de 3,5" (480x320). Modo manutenção:
; a evolução acontece em ../esp32-p4; o código comum fica em ../shared.
;   ./tools/firmware.sh s3 build | upload | deploy | monitor
[platformio]
src_dir = .
default_envs = nextneo-vista

; Common settings of every ESP32 (board) environment; each one says `extends = esp32`.
[esp32]
; Versão FIXA da plataforma (Arduino 3.3.12): o link "stable" muda sozinho e quebrou o build
; (61.04 / Arduino 4.0 não compila o GFX). Atualize de propósito, testando.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Placa com USB nativo (USB-Serial-JTAG): reset de gravação próprio. Obrigatório quando a
; gravação passa pela ponte RFC 2217 do Docker no macOS (lá o esptool não detecta o USB).
board_upload.before_reset = usb-reset
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_SKIP
    -DLV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
    ; LVGL heap in PSRAM (see src/nextneo-vista/lv_mem_psram.cpp). Frees the
    ; internal RAM mbedTLS needs -> fixes "SSL - Memory allocation failed".
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CUSTOM
    -DLV_USE_STDLIB_STRING=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_SPRINTF=LV_STDLIB_CLIB
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_36=1
    ; 42: Weather screen clock (36 + ~15 %)
    -DLV_FONT_MONTSERRAT_42=1
    -DLV_FONT_MONTSERRAT_48=1
    ; lv_snapshot: main menu drawn once into a picture (faster menu)
    -DLV_USE_SNAPSHOT=1
    ; PNG decoder (LVGL's lodepng): Futebol team crests from ESPN
    -DLV_USE_LODEPNG=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.5.6
    lvgl/lvgl@~9.6.0     ; 9.6+: per-flag API (lv_obj_set_hidden...) used by the app
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/JPEGDEC@^1.7.0

[env:nextneo-vista]
extends = esp32
build_src_filter = -<*> +<src/>
build_flags =
    ${esp32.build_flags}
    ; app root on the include path: every file includes "app_screens.h",
    ; "core/...", "services/..." and "modules/..." the same way, from any folder
    ; (os de ../shared/src vêm pela biblioteca, com os mesmos caminhos)
    -I src
; firmware file named after the app: .pio/build/nextneo-vista/nextneo-vista.bin
extra_scripts = pre:../tools/pio_progname.py
; código comum às placas (APIs, parsers, i18n, página web): ../shared
lib_deps =
    ${esp32.lib_deps}
    symlink://../shared
; Tabela que está gravada na placa desde 2026-11 (app0/app1 de 3264 KB).
; Fixada aqui para o -t upload nunca trocá-la. Limite do app: 3 342 336 bytes.
board_build.partitions = default_8MB.csv
; On-device tests (test/test_*/, Unity): pio test -e nextneo-vista
; They link the real app (test_build_src) and boot it with appSetup().
; Deploy (tests first, then the app): ./tools/firmware.sh s3 deploy
test_framework = unity
test_build_src = yes
test_speed = 115200
; test_screenshots is a tool (docs images), not a check: run it with
; ./tools/capture_screenshots.sh (env nextneo-vista-docs below)
test_ignore =
    test_screenshots

; Testes de lógica no computador: ficam em ../shared (./tools/firmware.sh shared pio test -e native).

; Screen images for the documentation (docs/screens/*.png).
[env:nextneo-vista-docs]
extends = env:nextneo-vista
test_ignore =
test_filter = test_screenshots

[env:lvgl-basic]
extends = esp32
build_src_filter = -<*> +<examples/lvgl-basic/>

[env:media-player]
extends = esp32
build_src_filter = -<*> +<examples/media-player/>

[env:music-player]
extends = esp32
build_src_filter = -<*> +<examples/music-player/>
build_flags =
    ${esp32.build_flags}
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    ${esp32.lib_deps}
    https://github.com/schreibfaul1/ESP32-audioI2S.git

