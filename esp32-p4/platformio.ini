; NextNeo Vista — placa Waveshare ESP32-P4-WIFI6-Touch-LCD-5 (tela 5" 720x1280 MIPI-DSI,
; touch capacitivo, Wi-Fi 6/BLE 5 pelo coprocessador ESP32-C6, 32 MB PSRAM, 32 MB flash,
; codec de áudio, slot TF, câmera MIPI-CSI). É a placa que EVOLUI; o código comum fica em
; ../shared e a placa antiga em ../esp32-s3.
;   ./tools/firmware.sh p4 build | upload | deploy | monitor
;
; ESTADO: esqueleto. Compila no Docker; tela inicial simples (placa, versão, Wi-Fi). Antes
; do primeiro upload, confira os itens "VERIFICAR NA PLACA" (README, seção "Placa ESP32-P4").
[platformio]
src_dir = .
default_envs = nextneo-vista

[env:nextneo-vista]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; VERIFICAR NA PLACA: revisão do chip (./tools/firmware.sh p4 esptool --port <porta> chip-id).
; rev. 3.x -> esp32-p4_r3 (400 MHz); revisões anteriores (ES) -> esp32-p4 (360 MHz).
board = esp32-p4_r3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; USB nativo (USB-Serial-JTAG): necessário pela ponte RFC 2217 do Docker no macOS.
board_upload.before_reset = usb-reset
board_upload.flash_size = 32MB
board_upload.maximum_size = 8388608
board_build.flash_mode = qio
board_build.partitions = partitions_32MB.csv
build_src_filter = -<*> +<src/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_SKIP
    -DLV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
    ; LVGL heap em PSRAM (shared/src/core/lv_mem_psram.cpp)
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CUSTOM
    -DLV_USE_STDLIB_STRING=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_SPRINTF=LV_STDLIB_CLIB
    ; Densidade ~294 dpi: as fontes da S3 x1,8 (14->24/26, 20->36, 28->48)
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_36=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_USE_SNAPSHOT=1
    -DLV_USE_LODEPNG=1
    -I src
extra_scripts = pre:../tools/pio_progname.py
lib_deps =
    lvgl/lvgl@~9.6.0
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/JPEGDEC@^1.7.0
    symlink://../shared
test_framework = unity
test_build_src = yes
test_speed = 115200
